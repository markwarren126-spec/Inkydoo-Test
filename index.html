<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Inkydoo</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{flex:none;text-align:center;padding:9px 12px 1px}.brand{font-size:clamp(19px,5.5vw,28px);letter-spacing:.29em;font-weight:650;padding-left:.29em;line-height:1.15}.tools{display:flex;justify-content:center;align-items:center;gap:clamp(12px,5vw,34px);padding:2px 8px 7px}.pen{width:46px;height:54px;display:flex;align-items:center;justify-content:center;border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;padding:3px;cursor:pointer}.pen.active{border-bottom-color:#111}.pen svg{height:44px;width:30px}.canvas-wrap{flex:1;min-height:0;margin:0 12px 9px;background:#fff;border:1px solid #d4d4d4;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 1px 3px #00000012}canvas{display:block;width:100%;height:100%;touch-action:none}.actions{display:flex;justify-content:center;gap:24px;padding:0 12px 7px}.action{background:transparent;border:0;color:#333;font-size:13px;padding:5px 9px;cursor:pointer}.action:focus-visible,.pen:focus-visible{outline:2px solid #222;outline-offset:2px}@media(min-width:700px){.app{max-width:650px;margin:auto}}
.clear-dialog{border:0;border-radius:18px;padding:0;width:min(340px,calc(100vw - 40px));max-width:100%;background:#fff;color:#171717;box-shadow:0 18px 55px #0003}.clear-dialog::backdrop{background:rgba(0,0,0,.38)}.clear-inner{padding:28px 24px 22px;text-align:center}.clear-brand{font-size:14px;font-weight:750;letter-spacing:.24em;margin-bottom:21px}.clear-heading{font-size:21px;font-weight:650;margin:0 0 9px}.clear-desc{font-size:14px;color:#666;line-height:1.5;margin:0 0 24px}.clear-options{display:flex;gap:10px}.clear-options button{flex:1;min-height:45px;border-radius:11px;border:1px solid #d5d5d5;background:#fff;color:#222;font:600 14px system-ui,Arial}.clear-options .confirm-clear{background:#222;border-color:#222;color:#fff}

#toolsToggle{font-size:12px;color:#333;flex-basis:48px}#instrumentMenu{position:absolute;top:5px;left:50%;transform:translateX(-50%);z-index:5;background:white;border:1px solid #ddd;border-radius:10px;display:flex;gap:12px;padding:4px 10px;box-shadow:0 3px 12px #0002}#instrumentMenu[hidden],#shapeHint[hidden]{display:none}#shapeGuide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}#shapeHint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:#555;background:#fffffff0;padding:5px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}canvas{transform-origin:0 0}.canvas-wrap{touch-action:none}.tools{gap:clamp(4px,4vw,24px)}</style></head><body><div class="app"><header><div class="brand">INKYDOO</div></header><div class="tools" id="tools"><button class="pen active" data-tool="fine" aria-label="Fine pen" title="Fine"><svg viewBox="0 0 40 65"><path d="M16 8 L24 8 L25 42 L20 58 L15 42Z" fill="#343434"/><path d="M17 8V2H23V8" fill="#aaa"/><path d="M15 42H25" stroke="white"/><path d="M20 58L18 50H22Z" fill="black"/></svg></button><button class="pen" data-tool="round" aria-label="Marker pen" title="Marker"><svg viewBox="0 0 40 65"><rect x="12" y="9" width="16" height="38" rx="3" fill="#333"/><path d="M14 9V3Q20 -1 26 3V9Z" fill="#666"/><path d="M14 47H26L23 57Q20 62 17 57Z" fill="#222"/><path d="M15 20H25" stroke="#999"/></svg></button><button class="pen" data-tool="chisel" aria-label="Chisel pen" title="Chisel"><svg viewBox="0 0 40 65"><path d="M11 10H29V46H11Z" fill="#444"/><path d="M12 10V3H28V10" fill="#aaa"/><path d="M11 46H29L24 59H15Z" fill="#111"/><path d="M15 59H24" stroke="#111" stroke-width="3"/></svg></button><button class="pen" data-tool="spray" aria-label="Spray pen" title="Spray"><svg viewBox="0 0 40 65"><rect x="9" y="16" width="22" height="43" rx="5" fill="#444"/><rect x="12" y="9" width="16" height="9" rx="2" fill="#888"/><rect x="16" y="4" width="8" height="6" rx="1" fill="#333"/><circle cx="20" cy="35" r="7" fill="#ddd"/><circle cx="20" cy="35" r="3" fill="#333"/></svg></button><button id="toolsToggle" class="pen" aria-expanded="false" aria-controls="instrumentMenu" aria-label="Drawing tools"><span>Tools<br>⌄</span></button></div><div class="canvas-wrap"><canvas id="canvas" aria-label="Drawing canvas"></canvas><div id="instrumentMenu" hidden><button class="pen" data-tool="eraser" aria-label="Standard eraser" title="Eraser"><svg viewBox="0 0 40 65"><g transform="rotate(25 20 32)"><rect x="11" y="12" width="18" height="40" rx="3" fill="white" stroke="#333" stroke-width="2"/><path d="M11 37H29" stroke="#333" stroke-width="2"/></g></svg></button><button class="pen" data-tool="precision" aria-label="Precision eraser" title="Precision eraser"><svg viewBox="0 0 40 65"><g transform="rotate(25 20 32)"><rect x="15" y="7" width="10" height="45" rx="2" fill="white" stroke="#333" stroke-width="2"/><path d="M15 39H25" stroke="#333" stroke-width="2"/></g></svg></button><button class="pen" data-shape="ruler" aria-label="Straight edge"><svg viewBox="0 0 40 65"><g transform="rotate(30 20 32)" fill="none" stroke="#333" stroke-width="2"><rect x="12" y="5" width="16" height="54" rx="2"/><path d="M12 12H20M12 20H17M12 28H20M12 36H17M12 44H20M12 52H17"/></g></svg></button><button class="pen" data-shape="compass" aria-label="Compass"><svg viewBox="0 0 40 65" fill="none" stroke="#333" stroke-width="2.5"><circle cx="20" cy="12" r="4"/><path d="M18 16L7 57M22 16L33 57M13 35H27M20 8V3"/></svg></button></div><svg id="shapeGuide" aria-hidden="true"></svg><div id="shapeHint" hidden></div><div class="eraser-guide" aria-hidden="true"></div></div><div class="actions"><button class="action" id="undo">↶ Undo</button><button class="action" id="clear">Clear</button><button class="action" id="save">↓ Save</button></div></div><dialog class="clear-dialog" id="clearDialog" aria-labelledby="clearTitle"><div class="clear-inner"><div class="clear-brand">INKYDOO</div><h2 class="clear-heading" id="clearTitle">Clear your canvas?</h2><div class="clear-options"><button type="button" id="cancelClear">Keep drawing</button><button type="button" class="confirm-clear" id="confirmClear">Clear canvas</button></div></div></dialog><script>
(()=>{
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),wrap=document.querySelector('.canvas-wrap');
let tool='fine',drawing=false,points=[],history=[],dpr=1,lastTime=0,inkWidth=2.5,rawPrev=null;
function resize(){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);const r={width:wrap.clientWidth,height:wrap.clientHeight};dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);if(old.width)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}
function snapshot(){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>18)history.shift()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom,t:e.timeStamp}}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function stamp(x,y,angle){ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/4);ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,0,8,1.75,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function chiselLine(a,b){const dist=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(1,Math.ceil(dist/.65));for(let i=0;i<=steps;i++){let t=i/steps;stamp(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,0)}}
function spray(p){ctx.fillStyle='rgba(0,0,0,.48)';for(let i=0;i<22;i++){let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*15;ctx.beginPath();ctx.arc(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,Math.random()*1.1+.2,0,Math.PI*2);ctx.fill()}}
function sprayLine(a,b){const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/3));for(let i=0;i<=n;i++)spray({x:a.x+(b.x-a.x)*i/n,y:a.y+(b.y-a.y)*i/n})}
// Slow movements deposit a broader stroke; fast movements become finer.
// Width is gently filtered to avoid jitter caused by uneven touch sampling.
function targetWidth(p,q){
 const distance=Math.hypot(q.x-p.x,q.y-p.y);
 const elapsed=Math.max(8,Math.min(90,(q.t||0)-(p.t||0)||16));
 const speed=distance/elapsed;
 const max=tool==='fine'?5.2:15, min=tool==='fine'?1.5:3.5;
 return min+(max-min)/(1+Math.pow(speed/(tool==='fine'?.42:.50),1.3));
}
function inkDot(x,y,width){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,width/2,0,Math.PI*2);ctx.fill()}
function strokeCurve(a,control,b,startWidth,endWidth){
 const length=Math.hypot(control.x-a.x,control.y-a.y)+Math.hypot(b.x-control.x,b.y-control.y);
 const steps=Math.max(1,Math.ceil(length/.8));
 for(let i=0;i<=steps;i++){
  const t=i/steps,u=1-t;
  const x=u*u*a.x+2*u*t*control.x+t*t*b.x;
  const y=u*u*a.y+2*u*t*control.y+t*t*b.y;
  inkDot(x,y,startWidth+(endWidth-startWidth)*t);
 }
}
function begin(e){e.preventDefault();snapshot();drawing=true;points=[pos(e)];rawPrev=points[0];inkWidth=tool==='fine'?3.2:9;canvas.setPointerCapture(e.pointerId);const p=points[0];if(tool==='spray')spray(p);else if(tool==='chisel')stamp(p.x,p.y);else{ctx.fillStyle='#111';ctx.beginPath();ctx.arc(p.x,p.y,inkWidth/2,0,Math.PI*2);ctx.fill()}}
function move(e){if(!drawing)return;e.preventDefault();const samples=e.getCoalescedEvents?.();const events=samples?.length?samples:[e];for(const ev of events){const raw=pos(ev),prev=points[points.length-1];
const rawDistance=Math.hypot(raw.x-rawPrev.x,raw.y-rawPrev.y);
if(rawDistance<.45)continue;
const elapsed=Math.max(8,Math.min(90,raw.t-rawPrev.t||16));
const speed=rawDistance/elapsed;
rawPrev=raw;
// The two round pens follow a gently filtered trajectory rather than
// reproducing every small finger wobble. Faster sweeps get a little more
// responsiveness, while slow movements receive more smoothing.
const alpha=(tool==='fine'||tool==='round')?Math.min(.48,Math.max(.24,.25+speed*.16)):1;
const p={x:prev.x+(raw.x-prev.x)*alpha,y:prev.y+(raw.y-prev.y)*alpha,t:raw.t};
if(Math.hypot(p.x-prev.x,p.y-prev.y)<.18)continue;
points.push(p);if(tool==='chisel'){chiselLine(prev,p)}else if(tool==='spray'){sprayLine(prev,p)}else {const next=targetWidth(prev,p),newWidth=inkWidth*.72+next*.28;if(points.length===2){const mid=midpoint(prev,p);strokeCurve(prev,prev,mid,inkWidth,newWidth)}else{const a=points[points.length-3],b=points[points.length-2],c=points[points.length-1];strokeCurve(midpoint(a,b),b,midpoint(b,c),inkWidth,newWidth)}inkWidth=newWidth}}}
function stop(e){if(!drawing)return;if(points.length>1&&(tool==='fine'||tool==='round')){const a=points[points.length-2],b=points[points.length-1];strokeCurve(midpoint(a,b),b,b,inkWidth,inkWidth)}drawing=false;points=[];rawPrev=null}
const guide=document.querySelector('.eraser-guide');
let erasePointer=null,erasePrev=null,eraseWidth=3;
function isEraser(){return tool==='eraser'||tool==='precision'}
function showGuide(p,w){guide.style.left=(p.x*zoom+tx)+'px';guide.style.top=(p.y*zoom+ty)+'px';guide.style.width=w*zoom+'px';guide.style.height=w*zoom+'px';guide.style.display='block'}
function eraseSegment(a,b,w0,w1){ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';const n=Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/.6));for(let i=0;i<=n;i++){const t=i/n;ctx.beginPath();ctx.arc(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,(w0+(w1-w0)*t)/2,0,Math.PI*2);ctx.fill()}ctx.restore()}
function eraseBegin(e){if(erasePointer!==null)return;e.preventDefault();snapshot();erasePointer=e.pointerId;erasePrev=pos(e);eraseWidth=tool==='precision'?3:16;canvas.setPointerCapture(e.pointerId);eraseSegment(erasePrev,erasePrev,eraseWidth,eraseWidth);showGuide(erasePrev,eraseWidth)}
function eraseMove(e){if(e.pointerId!==erasePointer)return;e.preventDefault();const samples=e.getCoalescedEvents?.();for(const ev of samples?.length?samples:[e]){const p=pos(ev),dist=Math.hypot(p.x-erasePrev.x,p.y-erasePrev.y);if(!dist)continue;const speed=dist/Math.max(8,Math.min(90,p.t-erasePrev.t||16));const target=tool==='precision'?3+21*speed/(speed+.8):16;const w=tool==='precision'?eraseWidth*.45+target*.55:16;eraseSegment(erasePrev,p,eraseWidth,w);erasePrev=p;eraseWidth=w;showGuide(p,w)}}
function eraseStop(e){if(e.pointerId!==erasePointer)return;erasePointer=null;erasePrev=null;guide.style.display='none'}
let zoom=1,tx=0,ty=0,shape=null,A=null,B=null,pen='fine',drag=null,shapePrev=null,shapeWidth=3,active=null,pinch=null,blocked=false,backup=null;
const fingers=new Map(),svg=document.querySelector('#shapeGuide'),hint=document.querySelector('#shapeHint'),menu=document.querySelector('#instrumentMenu'),toggle=document.querySelector('#toolsToggle');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function view(){tx=clamp(tx,wrap.clientWidth*(1-zoom),0);ty=clamp(ty,wrap.clientHeight*(1-zoom),0);canvas.style.transform=`translate(${tx}px,${ty}px) scale(${zoom})`;renderGuide()}
function screen(p){return {x:p.x*zoom+tx,y:p.y*zoom+ty}}
function renderGuide(){svg.innerHTML='';if(!shape||!A||!B)return;const a=screen(A),b=screen(B),r=Math.hypot(b.x-a.x,b.y-a.y);const el=(tag,attrs)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);svg.append(n)};if(shape==='ruler')el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#888','stroke-width':2,'stroke-dasharray':'5 4'});else el('circle',{cx:a.x,cy:a.y,r,fill:'none',stroke:'#888','stroke-width':1.5,'stroke-dasharray':'5 4'});for(const p of [a,b])el('circle',{cx:p.x,cy:p.y,r:9,fill:'white',stroke:'#555','stroke-width':1.5});}
function closeMenu(){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}
toggle.onclick=()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))};
function select(b){shape=null;hint.hidden=true;renderGuide();tool=b.dataset.tool;if(!isEraser())pen=tool;document.querySelectorAll('.pen').forEach(x=>x.classList.toggle('active',x===b));closeMenu()}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>select(b));
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{shape=b.dataset.shape;tool=pen;const w=wrap.clientWidth/zoom,h=wrap.clientHeight/zoom;A={x:(-tx)/zoom+w*.35,y:(-ty)/zoom+h*.45};B={x:A.x+w*.3,y:A.y};hint.textContent=shape==='ruler'?'Move handles • trace the straight edge':'Move centre or radius • trace the circle';hint.hidden=false;document.querySelectorAll('.pen').forEach(x=>x.classList.toggle('active',x===b||x.dataset.tool===pen));closeMenu();renderGuide()});
function project(p){const dx=B.x-A.x,dy=B.y-A.y,r=Math.max(.01,Math.hypot(dx,dy));if(shape==='ruler'){const t=clamp(((p.x-A.x)*dx+(p.y-A.y)*dy)/(r*r),0,1);return {x:A.x+t*dx,y:A.y+t*dy,t:p.t}}const angle=Math.atan2(p.y-A.y,p.x-A.x);return {x:A.x+r*Math.cos(angle),y:A.y+r*Math.sin(angle),angle,t:p.t}}
function shapeDot(p,w){if(tool==='chisel')stamp(p.x,p.y);else if(tool==='spray')spray(p);else inkDot(p.x,p.y,w)}
function shapeMove(p){const q=project(p),a=shapePrev;let delta=0,r=0;if(shape==='compass'){delta=Math.atan2(Math.sin(q.angle-a.angle),Math.cos(q.angle-a.angle));r=Math.hypot(B.x-A.x,B.y-A.y)}const len=shape==='compass'?Math.abs(delta)*r:Math.hypot(q.x-a.x,q.y-a.y);if(len<.2)return;const nw=tool==='fine'||tool==='round'?shapeWidth*.72+targetWidth(a,q)*.28:shapeWidth;const n=Math.max(1,Math.ceil(len/(tool==='spray'?3:.65)));for(let i=1;i<=n;i++){const t=i/n,ang=a.angle+delta*t;shapeDot(shape==='compass'?{x:A.x+r*Math.cos(ang),y:A.y+r*Math.sin(ang)}:{x:a.x+(q.x-a.x)*t,y:a.y+(q.y-a.y)*t},shapeWidth+(nw-shapeWidth)*t)}shapeWidth=nw;shapePrev=q}
function startPinch(){if(backup){ctx.putImageData(backup,0,0);history.pop()}backup=null;drawing=false;points=[];rawPrev=null;erasePointer=null;guide.style.display='none';shapePrev=null;drag=null;active=null;const [a,b]=[...fingers.values()];const rect=wrap.getBoundingClientRect(),mx=(a.x+b.x)/2-rect.left-wrap.clientLeft,my=(a.y+b.y)/2-rect.top-wrap.clientTop;pinch={dist:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),z:zoom,x:(mx-tx)/zoom,y:(my-ty)/zoom};blocked=true}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType==='mouse'&&e.button!==0)return;canvas.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===2){startPinch();return}if(blocked||fingers.size!==1)return;active=e.pointerId;closeMenu();const p=pos(e);if(shape){const near=q=>Math.hypot(p.x-q.x,p.y-q.y)*zoom<18;if(near(A)||near(B)){drag=near(A)?'A':'B';return}snapshot();backup=history.at(-1);shapePrev=project(p);shapeWidth=tool==='fine'?3.2:9;shapeDot(shapePrev,shapeWidth)}else{isEraser()?eraseBegin(e):begin(e);backup=history.at(-1)}});
canvas.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&fingers.size>=2){const [a,b]=[...fingers.values()],rect=wrap.getBoundingClientRect();zoom=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist,1,6);tx=(a.x+b.x)/2-rect.left-wrap.clientLeft-pinch.x*zoom;ty=(a.y+b.y)/2-rect.top-wrap.clientTop-pinch.y*zoom;view();return}if(blocked||active!==e.pointerId)return;if(drag){const p=pos(e);if(drag==='A'){if(shape==='compass'){B={x:B.x+p.x-A.x,y:B.y+p.y-A.y}}A=p}else if(Math.hypot(p.x-A.x,p.y-A.y)>8/zoom)B=p;renderGuide()}else if(shapePrev)shapeMove(pos(e));else if(erasePointer!==null)eraseMove(e);else move(e)});
function end(e){if(!fingers.has(e.pointerId))return;fingers.delete(e.pointerId);if(active===e.pointerId){if(erasePointer!==null)eraseStop(e);else if(drawing)stop(e);active=null;drag=null;shapePrev=null;backup=null}if(fingers.size<2)pinch=null;if(!fingers.size)blocked=false}
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,end);
document.querySelector('#undo').onclick=()=>{if(history.length)ctx.putImageData(history.pop(),0,0)};
const clearDialog=document.querySelector('#clearDialog');
document.querySelector('#clear').onclick=()=>clearDialog.showModal();
document.querySelector('#cancelClear').onclick=()=>clearDialog.close();
document.querySelector('#confirmClear').onclick=()=>{snapshot();ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr);clearDialog.close()};
document.querySelector('#save').onclick=()=>{canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-marker-drawing.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)},'image/png')};
resize();window.addEventListener('resize',()=>{resize();history=[];zoom=1;tx=ty=0;view()});
})();
</script><script>if ("serviceWorker" in navigator && !location.pathname.includes("/development/")) { window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {})); }</script></body></html>
